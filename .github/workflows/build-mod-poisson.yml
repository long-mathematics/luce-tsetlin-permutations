name: One-time mod-Poisson PDF preparation
on:
  push:
    branches: ['integrate-mod-poisson-20261020']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'long-mathematics/luce-tsetlin-permutations'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - name: Install TeX and numerical tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils python3 python3-numpy python3-scipy python3-sympy make
      - name: Build and validate all documents
        run: |
          make pdf
          make test
          make check
          make verify
      - name: Commit PDF snapshot and remove one-time workflow
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          test "$BRANCH" = "integrate-mod-poisson-20261020"
          test -s output/pdf/luce-mod-poisson.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-mod-poisson.yml
          git add output/pdf/luce-mod-poisson.pdf output/pdf/manifest.json
          git commit -m 'Build and register deterministic mod-Poisson PDF snapshot'
          git push origin "HEAD:$BRANCH"
