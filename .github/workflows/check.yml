name: Repository validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Tests and deterministic manuscript builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install TeX and numerical tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils python3 python3-numpy python3-scipy python3-sympy make
      - run: make test
      - run: make check
      - run: make verify
      - name: Export review material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-material
          path: |
            README.md
            papers.json
            THEOREM_STATUS.md
            DEPENDENCIES.md
            papers/
            notes/
            audits/
            archive/
            scripts/
            tests/
            output/
            .build/**/*.log
            .build/**/build-console.txt
          include-hidden-files: true
          retention-days: 14
