name: One-time independence and peeling integration
on:
  push:
    branches: ['integrate-independence-peeling-20261020']
    paths: ['.integration/independence-peeling.ready']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'long-mathematics/luce-tsetlin-permutations'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - name: Apply hash-checked reviewed changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, os, subprocess
          from pathlib import Path
          assert os.environ['BRANCH'] == 'integrate-independence-peeling-20261020'
          raw = b''.join(Path('.integration/independence-peeling.part'+str(i)).read_bytes() for i in (1,2))
          assert hashlib.sha256(raw).hexdigest() == '0901d8db29b0016034992872f9937678ab0c51be24a88bf8cd56cc67b6abec1b'
          payload = json.loads(lzma.decompress(raw))
          assert payload['schema_version'] == 1
          assert payload['baseline_commit'] == '38f195dc5b30812ebbf084764016e857a68b9a1c'
          subprocess.run(['git','merge-base','--is-ancestor',payload['baseline_commit'],'HEAD'], check=True)
          allowed = {'README.md','THEOREM_STATUS.md','DEPENDENCIES.md','papers.json','verification.json','papers/independence-peeling/luce_independence_peeling.tex','audits/independence-peeling-proof-audit.md','scripts/independence-peeling/check_consistency.py','tests/test_independence_peeling.py'}
          assert {o['path'] for o in payload['operations']} == allowed
          assert len(payload['operations']) == len(allowed)
          for op in payload['operations']:
              path = Path(op['path'])
              if op['before_sha256'] is not None:
                  assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == op['before_sha256'], str(path)
                  patch = op['patch'].encode()
                  assert op['patch'].startswith('--- a/'+str(path)+'\n+++ b/'+str(path)+'\n')
                  subprocess.run(['git','apply','--check','-'],input=patch,check=True)
                  subprocess.run(['git','apply','-'],input=patch,check=True)
              else:
                  assert not path.exists(), str(path)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(op['content'],encoding='utf-8')
              assert hashlib.sha256(path.read_bytes()).hexdigest() == op['after_sha256'], str(path)
              print('Verified', path)
          PY
      - name: Install TeX and numerical tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils python3 python3-numpy python3-scipy python3-sympy make
      - name: Build and validate all manuscripts
        run: |
          make pdf
          make test
          make check
          make verify
      - name: Commit reviewed files and remove one-time scaffolding
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          test "$BRANCH" = 'integrate-independence-peeling-20261020'
          python3 - <<'PY'
          import subprocess
          allowed = {'README.md','THEOREM_STATUS.md','DEPENDENCIES.md','papers.json','verification.json','papers/independence-peeling/luce_independence_peeling.tex','audits/independence-peeling-proof-audit.md','scripts/independence-peeling/check_consistency.py','tests/test_independence_peeling.py','output/pdf/luce-independence-peeling.pdf','output/pdf/manifest.json'}
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed | new <= allowed, sorted((changed | new) - allowed)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git rm .github/workflows/prepare-independence-peeling.yml .integration/independence-peeling.part1 .integration/independence-peeling.part2 .integration/independence-peeling.ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Register audited independence and peeling paper with deterministic PDF'
          git push origin "HEAD:$BRANCH"
      - name: Export review material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independence-peeling-review
          path: |
            papers/independence-peeling/
            output/pdf/luce-independence-peeling.pdf
            output/pdf/manifest.json
            audits/independence-peeling-proof-audit.md
            scripts/independence-peeling/
            tests/test_independence_peeling.py
            .build/independence-peeling/
            .build/verification/
          include-hidden-files: true
          retention-days: 14
