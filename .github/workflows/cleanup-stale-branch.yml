name: Remove one-time cleanup workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    name: Remove temporary workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.repository == 'long-mathematics/luce-tsetlin-permutations'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Remove this one-time workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/cleanup-stale-branch.yml
          git add .github/workflows/cleanup-stale-branch.yml
          git commit -m "Remove one-time stale branch cleanup workflow"
          git push origin HEAD:main
